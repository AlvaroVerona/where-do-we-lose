name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      # Generating the dataset takes ~15s, so CI runs the real thing end to end:
      # data -> model -> scenario reports -> tests (the dashboard tests need them).
      - name: Generate data, train model, run optimization
        run: |
          python -m src.data.generate_data
          python -m src.models.train
          python -m src.optimization.resource_allocation
      - name: Test
        run: python -m pytest -q
