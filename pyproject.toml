[project]
name = "process-bottleneck-optimization"
version = "0.1.0"
description = "Where do We Lose? — Process Bottleneck Detection & Optimization System"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "plotly>=5.22",
    "streamlit>=1.36",
    "shap>=0.46",
    "joblib>=1.4",
    "ortools>=9.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]
# Only the exploratory notebooks (01-04) need these.
notebooks = [
    "statsmodels>=0.14",
    "seaborn>=0.13",
    "networkx>=3.3",
    "pm4py>=2.7",
    "jupyter>=1.0",
    "nbformat>=5.10",
    "ipykernel>=6.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "app*"]
